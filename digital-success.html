<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff5ca8">
  <title>MUSA Digital · Tu compra ♡</title>
  <link rel="icon" href="assets/musa-logo.jpg">
  <link rel="stylesheet" href="styles.css">
  <style>
    .digital-result{max-width:820px;margin:55px auto;padding:55px 24px;text-align:center}
    .digital-result .eyebrow{margin-bottom:12px}
    .digital-result h1{font-family:"Playfair Display",serif;font-size:clamp(2.6rem,7vw,5rem);margin:0 0 18px;line-height:.95}
    .digital-result p{max-width:600px;margin:0 auto 28px;color:#665b63;line-height:1.7}
    .download-list{display:grid;gap:12px;max-width:520px;margin:30px auto}
    .download-card{background:#fff;border:1px solid #eadfe5;border-radius:18px;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:15px;text-align:left}
    .download-card strong{font-size:12px}
    .download-card small{display:block;color:#8a7d86;margin-top:4px}
    .download-card a{white-space:nowrap}
    .tiny{font-size:.85rem!important;color:#8a7d86!important;margin-top:22px!important}
  </style>
</head>
<body>
  <div class="announcement"><span>✨ MUSA DIGITAL</span><i></i><span>made with love ♡</span></div>
  <header class="site-header">
    <a class="brand" href="index.html"><img class="brand-logo" src="assets/musa-logo.jpg" alt="MUSA"></a>
    <div class="header-actions"></div>
  </header>
  <main class="digital-result">
    <p class="eyebrow">MUSA DIGITAL ♡</p>
    <h1 id="title">Estamos verificando tu pago...</h1>
    <p id="message">Un segundo. Primero confirmamos el estado de la operación con Mercado Pago y recién después habilitamos tus descargas.</p>
    <div id="downloads" class="download-list"></div>
    <p class="tiny" id="detail"></p>
    <p><a class="btn btn-pink" href="index.html">VOLVER A MUSA ♡</a></p>
  </main>
  <script>
    const params=new URLSearchParams(location.search);
    const paymentId=params.get("payment_id")||params.get("collection_id");
    const order=params.get("order")||params.get("external_reference");
    const state=params.get("state");
    const title=document.querySelector("#title");
    const message=document.querySelector("#message");
    const downloads=document.querySelector("#downloads");
    const detail=document.querySelector("#detail");

    async function verify(){
      if(state==="failure"){
        title.textContent="El pago no se completó.";
        message.textContent="Podés volver a MUSA e intentarlo nuevamente cuando quieras. ♡";
        return;
      }
      if(!paymentId||!order){
        title.textContent="Nos falta confirmar tu operación.";
        message.textContent="Si Mercado Pago te mostró el pago como aprobado, esperá unos segundos y volvé a abrir el enlace de retorno.";
        return;
      }
      try{
        const r=await fetch("/api/verify-payment?payment_id="+encodeURIComponent(paymentId)+"&order="+encodeURIComponent(order),{cache:"no-store"});
        const data=await r.json();
        if(data.approved){
          title.textContent="Tu MUSA ya es tuya. ♡";
          message.textContent="¡Listo! El pago fue aprobado. Descargá tus workbooks desde acá.";
          downloads.innerHTML=(data.downloads||[]).map(item=>`<div class="download-card"><div><strong>${item.name}</strong><small>PDF · descarga digital</small></div><a class="btn btn-pink" href="${item.downloadUrl}">DESCARGAR ↗</a></div>`).join("");
          detail.textContent="Por seguridad, estos enlaces de descarga son temporales.";
          localStorage.removeItem("musaBag");
        }else{
          title.textContent=data.status==="pending"?"Estamos esperando la confirmación ♡":"El pago todavía no está aprobado.";
          message.textContent=data.message||"Cuando Mercado Pago confirme el pago, vas a poder descargar tu producto.";
          detail.textContent="Podés actualizar esta página en unos minutos.";
        }
      }catch(e){
        title.textContent="Estamos teniendo un pequeño inconveniente.";
        message.textContent="No pudimos verificar el pago en este momento. Volvé a intentarlo en unos minutos.";
      }
    }
    verify();
  </script>
</body>
</html>
